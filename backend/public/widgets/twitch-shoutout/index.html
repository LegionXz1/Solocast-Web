<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Twitch Shoutout Widget</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/adapter.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap');

    :root {
      --accent-color: #9146ff;
      --secondary-color: #00f2fe;
      --card-bg: rgba(15, 15, 23, 0.94);
      --text-color: #ffffff;
      --font-family: 'Outfit', sans-serif;
      --duration: 14s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: var(--font-family);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #so-container {
      opacity: 0;
      transform: translateY(50px) scale(0.94);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      width: clamp(520px, 65vw, 920px);
    }

    #so-container.active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    #so-card {
      position: relative;
      background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
        linear-gradient(135deg, var(--accent-color), var(--secondary-color)) border-box;
      border: 2.5px solid transparent;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(145, 70, 255, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text-color);
      overflow: hidden;
    }

    /* Header */
    .so-header {
      padding: 16px 24px 12px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .so-badge {
      background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 100px;
      text-transform: uppercase;
      box-shadow: 0 0 15px rgba(145, 70, 255, 0.4);
      white-space: nowrap;
    }

    .so-cta {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Body */
    .so-body {
      padding: 24px;
      display: flex;
      gap: 24px;
      align-items: stretch;
    }

    /* Profile Section */
    .so-profile {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 240px;
    }

    .so-avatar-box {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 4px;
    }

    .so-avatar-glow {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-color), var(--secondary-color));
      opacity: 0.8;
      filter: blur(10px);
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% {
        transform: scale(0.95);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.08);
        opacity: 0.9;
      }
    }

    #so-avatar {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.9);
      background: #1a1a24;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .so-names h2 {
      font-size: clamp(1.4rem, 2.2vw, 1.9rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      background: linear-gradient(90deg, #ffffff, #e0e7ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .so-channel-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--secondary-color);
      font-weight: 600;
      margin-top: 3px;
    }

    .so-game-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(145, 70, 255, 0.18);
      border: 1px solid rgba(145, 70, 255, 0.35);
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #e0e7ff;
      font-weight: 600;
      align-self: flex-start;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .so-bio {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.72);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }

    /* Video Clip Section */
    .so-clip-wrapper {
      flex: 1.3;
      min-width: 280px;
      display: flex;
    }

    .so-video-card {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #09090e;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    #so-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .so-clip-label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.65);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      backdrop-filter: blur(6px);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
      animation: pulseDot 1.2s infinite;
    }

    @keyframes pulseDot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.85);
      }
    }

    .so-clip-title {
      position: relative;
      z-index: 5;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #ffffff;
      background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.85) 70%);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Progress Track */
    .so-progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    #so-progress-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--accent-color), var(--secondary-color));
      box-shadow: 0 0 10px var(--accent-color);
      transform-origin: left;
    }

    .anim-progress {
      animation: countdown var(--duration) linear forwards;
    }

    @keyframes countdown {
      from {
        transform: scaleX(1);
      }

      to {
        transform: scaleX(0);
      }
    }
  </style>
</head>

<body>
  <div id="so-container">
    <div id="so-card">
      <!-- Header Banner -->
      <div class="so-header">
        <div class="so-badge" id="so-badge">GO CHECK OUT</div>
        <div class="so-cta" id="so-cta">Support this awesome creator on Twitch!</div>
      </div>

      <!-- Main Content Body -->
      <div class="so-body">
        <!-- Streamer Profile Column -->
        <div class="so-profile">
          <div class="so-avatar-box">
            <div class="so-avatar-glow"></div>
            <img id="so-avatar" src="" alt="Streamer Avatar" />
          </div>
          <div class="so-names">
            <h2 id="so-display-name">StreamerName</h2>
            <div class="so-channel-link">
              <svg class="twitch-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path
                  d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z" />
              </svg>
              <span id="so-login">twitch.tv/channel</span>
            </div>
          </div>

          <div class="so-game-badge" id="so-game-badge">
            <svg class="so-game-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="6" width="20" height="12" rx="2"></rect>
              <path d="M6 12h4m-2-2v4m7-1h.01m3-2h.01"></path>
            </svg>
            <span id="so-game-name">Just Chatting</span>
          </div>

          <p class="so-bio" id="so-bio"></p>
        </div>

        <!-- Video Clip Preview Column (Shown if playClip is enabled) -->
        <div class="so-clip-wrapper" id="so-clip-wrapper">
          <div class="so-video-card">
            <div class="so-clip-label">
              <span class="pulse-dot"></span>
              <span>FEATURED CLIP</span>
            </div>
            <video id="so-video" playsinline preload="auto" crossorigin="anonymous"></video>
            <div class="so-clip-title" id="so-clip-title"></div>
          </div>
        </div>
      </div>

      <!-- Countdown Progress Bar -->
      <div class="so-progress-track">
        <div id="so-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'https://legionx.alwaysdata.net';

    let config = {
      headerText: 'GO CHECK OUT',
      subHeaderText: 'Support this awesome creator on Twitch!',
      displayDuration: 15,
      playClip: true,
      clipDuration: 15,
      clipVolume: 35,
      showBio: true,
      showGame: true,
      accentColor: '#9146ff',
      secondaryColor: '#00f2fe',
      cardBgColor: 'rgba(15, 15, 23, 0.94)',
      textColor: '#ffffff',
      soundUrl: 'https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3',
      soundVolume: 60
    };

    const shoutoutQueue = [];
    let isShowing = false;
    let currentShowingChannel = '';
    let hideTimeout = null;
    const recentShoutouts = new Map(); // channelName -> timestamp
    const DEDUPE_WINDOW_MS = 12000; // 12 seconds cooldown per channel

    function applySettings(data) {
      if (!data) return;
      config = { ...config, ...data };

      const root = document.documentElement;
      if (config.accentColor) root.style.setProperty('--accent-color', config.accentColor);
      if (config.secondaryColor) root.style.setProperty('--secondary-color', config.secondaryColor);
      if (config.cardBgColor) root.style.setProperty('--card-bg', config.cardBgColor);
      if (config.textColor) root.style.setProperty('--text-color', config.textColor);
      if (config.displayDuration) root.style.setProperty('--duration', `${config.displayDuration}s`);

      const badgeEl = document.getElementById('so-badge');
      if (badgeEl && config.headerText) badgeEl.textContent = config.headerText;

      const ctaEl = document.getElementById('so-cta');
      if (ctaEl && config.subHeaderText) ctaEl.textContent = config.subHeaderText;
    }

    window.addEventListener('onWidgetLoad', (e) => {
      const fieldData = e.detail?.fieldData || e.detail;
      applySettings(fieldData);
    });

    window.addEventListener('onFieldsUpdate', (e) => {
      const fieldData = e.detail?.fieldData || e.detail;
      applySettings(fieldData);
    });

    window.addEventListener('onEventReceived', (e) => {
      const obj = e.detail;
      if (!obj) return;

      let targetChannel = '';

      if (obj.listener === 'shoutout-latest' || obj.event?.type === 'shoutout' || obj.type === 'shoutout') {
        const ev = obj.event || obj;
        targetChannel = ev.targetChannel || ev.channel || ev.data?.channel || ev.data?.username || ev.username || '';
      } else if (obj.listener === 'message' || obj.event?.type === 'message') {
        const text = (obj.event?.text || obj.event?.data?.text || obj.data?.text || '').trim();
        const parts = text.split(/\s+/);
        if (parts.length >= 2 && (parts[0].toLowerCase() === '!so' || parts[0].toLowerCase() === '!shoutout')) {
          targetChannel = parts[1].replace('@', '').toLowerCase();
        }
      }

      if (targetChannel) {
        queueShoutout(targetChannel);
      }
    });

    function queueShoutout(channel) {
      if (!channel) return;
      const cleanName = channel.trim().toLowerCase().replace('@', '');
      if (!cleanName) return;

      const now = Date.now();
      const lastTrigger = recentShoutouts.get(cleanName) || 0;
      if (now - lastTrigger < DEDUPE_WINDOW_MS) {
        console.log(`[Shoutout] ⏭️ Ignored duplicate shoutout for "${cleanName}" (${Math.round((DEDUPE_WINDOW_MS - (now - lastTrigger)) / 1000)}s cooldown remaining)`);
        return;
      }

      if (currentShowingChannel === cleanName || shoutoutQueue.includes(cleanName)) {
        console.log(`[Shoutout] ⏭️ Ignored duplicate: "${cleanName}" is already showing or queued`);
        return;
      }

      recentShoutouts.set(cleanName, now);
      console.log('[Shoutout] 📥 Queued shoutout for channel:', cleanName);
      shoutoutQueue.push(cleanName);
      processQueue();
    }

    async function processQueue() {
      if (isShowing || shoutoutQueue.length === 0) return;

      isShowing = true;
      const channel = shoutoutQueue.shift();
      currentShowingChannel = channel;
      await displayShoutout(channel);
    }

    async function displayShoutout(channelName) {
      const cleanName = channelName.trim().toLowerCase().replace('@', '');
      console.log('[Shoutout] 🚀 Fetching data for:', cleanName);

      let userInfo = null;
      let userStatus = null;
      let clipData = null;

      try {
        const res = await fetch(`${API_BASE}/getuserinfo.php?channel=${encodeURIComponent(cleanName)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.data && json.data.length > 0) {
            userInfo = json.data[0];
          }
        }
      } catch (err) {
        console.warn('[Shoutout] Error fetching user info:', err);
      }

      if (!userInfo) {
        userInfo = {
          login: cleanName,
          display_name: cleanName,
          profile_image_url: 'https://static-cdn.jtvnw.net/user-default-pictures-uv/75305d54-c7ba-40d2-965a-52834b6f79e8-profile_image-300x300.png',
          description: 'Check out this awesome streamer on Twitch!'
        };
      }

      if (config.showGame) {
        try {
          const res = await fetch(`${API_BASE}/getuserstatus.php?channel=${encodeURIComponent(cleanName)}`);
          if (res.ok) {
            const json = await res.json();
            if (json.data && json.data.length > 0) {
              userStatus = json.data[0];
            }
          }
        } catch (err) {
          console.warn('[Shoutout] Error fetching user status:', err);
        }
      }

      if (config.playClip) {
        try {
          const res = await fetch(`${API_BASE}/getuserclips.php?channel=${encodeURIComponent(cleanName)}&limit=5&random=true`);
          if (res.ok) {
            const json = await res.json();
            if (json.data && json.data.length > 0) {
              clipData = json.data[0];
            }
          }
        } catch (err) {
          console.warn('[Shoutout] Error fetching clip:', err);
        }
      }

      const avatarEl = document.getElementById('so-avatar');
      const nameEl = document.getElementById('so-display-name');
      const linkEl = document.getElementById('so-login');
      const gameBadgeEl = document.getElementById('so-game-badge');
      const gameNameEl = document.getElementById('so-game-name');
      const bioEl = document.getElementById('so-bio');
      const clipWrapper = document.getElementById('so-clip-wrapper');
      const videoEl = document.getElementById('so-video');
      const clipTitleEl = document.getElementById('so-clip-title');
      const container = document.getElementById('so-container');
      const progressBar = document.getElementById('so-progress-bar');

      if (avatarEl) avatarEl.src = userInfo.profile_image_url || '';
      if (nameEl) nameEl.textContent = userInfo.display_name || cleanName;
      if (linkEl) linkEl.textContent = `twitch.tv/${userInfo.login || cleanName}`;

      if (gameBadgeEl) {
        if (config.showGame && userStatus && userStatus.game_name) {
          gameNameEl.textContent = userStatus.game_name;
          gameBadgeEl.style.display = 'inline-flex';
        } else {
          gameBadgeEl.style.display = 'none';
        }
      }

      if (bioEl) {
        if (config.showBio && userInfo.description) {
          bioEl.textContent = userInfo.description;
          bioEl.style.display = '-webkit-box';
        } else {
          bioEl.style.display = 'none';
        }
      }

      let hasVideo = false;
      if (config.playClip && clipData && (clipData.clip_url || clipData.id)) {
        const streamVideoUrl = clipData.clip_url || `${API_BASE}/getclipurl.php?id=${clipData.id}&url=true`;
        if (videoEl) {
          const targetVol = Math.max(0, Math.min(1, (config.clipVolume || 35) / 100));
          videoEl.volume = targetVol;
          videoEl.muted = false;
          videoEl.src = streamVideoUrl;
          videoEl.load();

          // Reliable play with muted autoplay fallback for cold start / OBS / browser policies
          const attemptPlay = () => {
            const playPromise = videoEl.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.warn('[Shoutout] Unmuted autoplay blocked by browser policy, attempting muted play fallback:', err);
                videoEl.muted = true;
                videoEl.play().then(() => {
                  console.log('[Shoutout] Video playback started (muted fallback)');
                  // Attempt unmuting once playback is underway
                  setTimeout(() => {
                    try {
                      videoEl.muted = false;
                      videoEl.volume = targetVol;
                    } catch (e) {}
                  }, 400);
                }).catch((e) => {
                  console.error('[Shoutout] Video playback completely failed:', e);
                });
              });
            }
          };

          attemptPlay();
          videoEl.onloadedmetadata = () => {
            if (videoEl.paused) attemptPlay();
          };
          videoEl.oncanplay = () => {
            if (videoEl.paused) attemptPlay();
          };
        }
        if (clipTitleEl) {
          clipTitleEl.textContent = clipData.title || 'Featured Clip';
        }
        if (clipWrapper) clipWrapper.style.display = 'flex';
        hasVideo = true;
      } else {
        if (clipWrapper) clipWrapper.style.display = 'none';
        if (videoEl) {
          videoEl.pause();
          videoEl.removeAttribute('src');
          videoEl.load();
        }
      }

      playNotificationSound();

      const durationSec = hasVideo
        ? (parseInt(config.clipDuration || config.displayDuration, 10) || 15)
        : (parseInt(config.displayDuration, 10) || 15);
      const durationMs = durationSec * 1000;

      document.documentElement.style.setProperty('--duration', `${durationSec}s`);
      if (progressBar) {
        progressBar.style.animationDuration = `${durationSec}s`;
        progressBar.classList.remove('anim-progress');
        void progressBar.offsetWidth;
        progressBar.classList.add('anim-progress');
      }

      if (container) {
        container.classList.add('active');
      }

      clearTimeout(hideTimeout);
      hideTimeout = setTimeout(() => {
        hideShoutout();
      }, durationMs);
    }

    function hideShoutout() {
      const container = document.getElementById('so-container');
      const videoEl = document.getElementById('so-video');

      if (container) {
        container.classList.remove('active');
      }

      if (videoEl) {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
      }

      setTimeout(() => {
        isShowing = false;
        currentShowingChannel = '';
        processQueue();
      }, 600);
    }

    function playNotificationSound() {
      if (!config.soundUrl) return;
      try {
        const audio = new Audio(config.soundUrl);
        audio.volume = Math.max(0, Math.min(1, (config.soundVolume || 60) / 100));
        audio.play().catch(err => console.log('[Shoutout] Audio play error:', err));
      } catch (err) { }
    }
  </script>
</body>

</html>
