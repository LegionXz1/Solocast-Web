<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valorant Agent Randomizer</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/adapter.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700;800&family=Teko:wght@600;700&family=Sarabun:wght@400;600&display=swap');

    :root {
      --val-red: #FF4655;
      --val-red-glow: rgba(255, 70, 85, 0.45);
      --val-dark: #0F1923;
      --val-darker: #080D12;
      --val-white: #ECE8E1;
      --val-gray: #768079;
      --val-cyan: #00F0FF;
      --val-gold: #E5B869;
      --val-purple: #9B5DE5;

      --role-duelist: #FF4655;
      --role-initiator: #E5B869;
      --role-controller: #9B5DE5;
      --role-sentinel: #00F0FF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
    }

    /* Container wrapper */
    #val-overlay {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.92) translateY(30px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    #val-overlay.active {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
    }

    /* Tactical HUD Header */
    .tactical-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      background: rgba(15, 25, 35, 0.85);
      border-left: 4px solid var(--val-red);
      border-right: 4px solid var(--val-red);
      padding: 8px 24px;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px var(--val-red-glow);
    }

    .tactical-tag {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--val-red);
      text-transform: uppercase;
    }

    .tactical-divider {
      width: 1px;
      height: 14px;
      background: rgba(236, 232, 225, 0.25);
    }

    .tactical-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--val-white);
      text-transform: uppercase;
    }

    .requester-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 70, 85, 0.15);
      border: 1px solid rgba(255, 70, 85, 0.4);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--val-white);
    }

    .requester-badge img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
    }

    /* Single Agent Showcase Card */
    .agent-card-main {
      position: relative;
      width: 580px;
      height: 680px;
      background: linear-gradient(160deg, rgba(15, 25, 35, 0.95) 0%, rgba(8, 13, 18, 0.98) 100%);
      border: 2px solid rgba(236, 232, 225, 0.15);
      border-radius: 4px;
      clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 30px, 100% 100%, 30px 100%, 0 calc(100% - 30px));
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 70, 85, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Card Cyber Details */
    .corner-bracket-tl {
      position: absolute;
      top: 10px;
      left: 10px;
      width: 20px;
      height: 20px;
      border-top: 2px solid var(--val-red);
      border-left: 2px solid var(--val-red);
      z-index: 5;
    }

    .corner-bracket-br {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 20px;
      height: 20px;
      border-bottom: 2px solid var(--val-cyan);
      border-right: 2px solid var(--val-cyan);
      z-index: 5;
    }

    .cyber-watermark {
      position: absolute;
      top: 20px;
      right: 24px;
      font-family: 'Teko', sans-serif;
      font-size: 80px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.03);
      line-height: 1;
      pointer-events: none;
      z-index: 1;
      text-transform: uppercase;
    }

    /* Background dynamic artwork */
    .agent-bg-art {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      mix-blend-mode: screen;
      filter: grayscale(40%);
      z-index: 1;
      transition: opacity 0.6s ease;
    }

    /* Portrait Image Container */
    .portrait-stage {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      overflow: visible;
    }

    .agent-portrait-img {
      position: absolute;
      bottom: -30px;
      width: 120%;
      height: 115%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.9));
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease;
    }

    /* Glowing Aura behind portrait */
    .agent-glow-aura {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.4;
      z-index: 1;
      transition: background 0.5s ease;
    }

    /* Bottom Information HUD */
    .agent-info-hud {
      position: relative;
      z-index: 4;
      background: linear-gradient(180deg, transparent 0%, rgba(8, 13, 18, 0.95) 40%, #080D12 100%);
      padding: 24px 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .role-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      border-radius: 2px;
      clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(255, 70, 85, 0.15);
      border: 1px solid var(--val-red);
      color: var(--val-white);
    }

    .role-pill img {
      width: 16px;
      height: 16px;
      filter: brightness(0) invert(1);
    }

    .protocol-code {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--val-gray);
      font-weight: 600;
    }

    .agent-name-main {
      font-family: 'Teko', sans-serif;
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 4px;
      line-height: 0.9;
      color: var(--val-white);
      text-transform: uppercase;
      text-shadow: 0 0 25px rgba(255, 70, 85, 0.6), 0 4px 8px rgba(0, 0, 0, 0.9);
      margin-top: 2px;
    }

    /* Abilities Mini-Bar */
    .abilities-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 4px;
    }

    .ability-slot {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4px 10px;
      border-radius: 2px;
    }

    .ability-slot img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      filter: brightness(0.9);
    }

    .ability-name {
      font-size: 12px;
      font-weight: 600;
      color: rgba(236, 232, 225, 0.7);
      letter-spacing: 1px;
    }

    /* Roulette Rolling Overlay */
    .roulette-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      background: rgba(15, 25, 35, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      backdrop-filter: blur(10px);
      transition: opacity 0.4s ease;
    }

    .roulette-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .roulette-status {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--val-red);
      text-transform: uppercase;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; text-shadow: 0 0 10px var(--val-red); }
    }

    .roulette-name-spinner {
      font-family: 'Teko', sans-serif;
      font-size: 72px;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--val-white);
      text-transform: uppercase;
      text-shadow: 0 0 30px var(--val-red-glow);
    }

    .roulette-icon-spinner {
      width: 110px;
      height: 110px;
      border: 2px solid var(--val-red);
      border-radius: 4px;
      padding: 10px;
      background: rgba(0, 0, 0, 0.5);
      box-shadow: 0 0 30px rgba(255, 70, 85, 0.35);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .roulette-icon-spinner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Team Composition Mode (5 Agents Grid) */
    .team-grid {
      display: none;
      gap: 16px;
      max-width: 1400px;
    }

    .team-mode .agent-card-main {
      display: none !important;
    }

    .team-mode .team-grid {
      display: flex !important;
    }

    .team-agent-card {
      width: 240px;
      height: 480px;
      background: linear-gradient(160deg, rgba(15, 25, 35, 0.95) 0%, rgba(8, 13, 18, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 16px 100%, 0 calc(100% - 16px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .team-agent-card.revealed {
      transform: translateY(0);
      opacity: 1;
    }

    .team-agent-card .team-portrait {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .team-agent-card .team-portrait img {
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 150%;
      height: 110%;
      object-fit: contain;
      object-position: bottom;
    }

    .team-agent-info {
      padding: 14px 16px;
      background: #080D12;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 2;
    }

    .team-agent-name {
      font-family: 'Teko', sans-serif;
      font-size: 36px;
      line-height: 0.9;
      font-weight: 700;
      color: var(--val-white);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Lock-in Flash Effect */
    .lockin-flash {
      position: absolute;
      inset: 0;
      background: white;
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      transition: opacity 0.15s ease-out;
    }

    .lockin-flash.flash {
      opacity: 0.85;
      transition: none;
    }
  </style>
</head>
<body>

  <div id="val-overlay">
    <!-- Header HUD -->
    <div class="tactical-header">
      <span class="tactical-tag">PROTOCOL</span>
      <div class="tactical-divider"></div>
      <span class="tactical-title" id="hud-title">AGENT SELECTION // RANDOMIZER</span>
      <div class="requester-badge" id="requester-pill" style="display: none;">
        <img id="requester-avatar" src="" alt="user">
        <span id="requester-name">Viewer</span>
      </div>
    </div>

    <!-- Mode 1: Single Agent Showcase -->
    <div class="agent-card-main" id="single-agent-card">
      <div class="corner-bracket-tl"></div>
      <div class="corner-bracket-br"></div>
      <div class="cyber-watermark" id="watermark-role">DUELIST</div>

      <!-- Agent Background Art -->
      <div class="agent-bg-art" id="agent-bg"></div>

      <!-- Portrait Stage -->
      <div class="portrait-stage">
        <div class="agent-glow-aura" id="agent-aura"></div>
        <img class="agent-portrait-img" id="agent-portrait" src="" alt="Agent">
      </div>

      <!-- Info HUD -->
      <div class="agent-info-hud">
        <div class="role-row">
          <div class="role-pill" id="role-pill">
            <img id="role-icon" src="" alt="role">
            <span id="role-name">DUELIST</span>
          </div>
          <span class="protocol-code" id="protocol-id">// VAL-ID: AGENT-01</span>
        </div>

        <div class="agent-name-main" id="agent-name">JETT</div>

        <!-- Abilities List -->
        <div class="abilities-row" id="abilities-container">
          <!-- Injected dynamically -->
        </div>
      </div>

      <!-- Rolling Spinner Screen -->
      <div class="roulette-overlay" id="roulette-screen">
        <div class="roulette-status">// INITIATING TACTICAL PROTOCOL...</div>
        <div class="roulette-icon-spinner">
          <img id="spinner-icon" src="" alt="rolling">
        </div>
        <div class="roulette-name-spinner" id="spinner-name">INITIALIZING</div>
      </div>

      <div class="lockin-flash" id="card-flash"></div>
    </div>

    <!-- Mode 2: Team Composition Grid -->
    <div class="team-grid" id="team-grid-container">
      <!-- 5 Team Cards injected dynamically -->
    </div>
  </div>

  <script>
    let allAgents = [];
    let config = {
      roleFilter: 'all',
      mode: 'single',
      displayDuration: 9,
      soundVolume: 40,
      enableSound: true,
      showAbilities: true,
      showRoleBadge: true,
      showRequester: true
    };

    let hideTimer = null;
    let audioCtx = null;

    // Web Audio API Synthesizer for high-tech Valorant sounds
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      if (!config.enableSound || config.soundVolume <= 0) return;
      try {
        const ctx = getAudioContext();
        const masterVol = (config.soundVolume || 40) / 100;

        if (type === 'tick') {
          // Sharp cyber tick
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(850, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(150, ctx.currentTime + 0.04);
          gain.gain.setValueAtTime(0.3 * masterVol, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.04);
        } else if (type === 'lockin') {
          // Powerful bass drop + tactical cyber chime
          const bass = ctx.createOscillator();
          const bassGain = ctx.createGain();
          bass.type = 'sine';
          bass.frequency.setValueAtTime(160, ctx.currentTime);
          bass.frequency.exponentialRampToValueAtTime(45, ctx.currentTime + 0.45);
          bassGain.gain.setValueAtTime(0.7 * masterVol, ctx.currentTime);
          bassGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          bass.connect(bassGain);
          bassGain.connect(ctx.destination);
          bass.start();
          bass.stop(ctx.currentTime + 0.45);

          const chime = ctx.createOscillator();
          const chimeGain = ctx.createGain();
          chime.type = 'sawtooth';
          chime.frequency.setValueAtTime(1200, ctx.currentTime);
          chime.frequency.exponentialRampToValueAtTime(600, ctx.currentTime + 0.35);
          chimeGain.gain.setValueAtTime(0.35 * masterVol, ctx.currentTime);
          chimeGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
          chime.connect(chimeGain);
          chimeGain.connect(ctx.destination);
          chime.start();
          chime.stop(ctx.currentTime + 0.35);
        }
      } catch (e) {
        console.warn('Audio error:', e);
      }
    }

    // Load Valorant Agents Database
    async function loadAgents() {
      try {
        const res = await fetch('/api/widgets/valorant-agent/agents');
        if (res.ok) {
          const data = await res.json();
          allAgents = data.agents || [];
          console.log(`[Valorant] Loaded ${allAgents.length} agents successfully.`);
        }
      } catch (e) {
        console.warn('[Valorant] Error loading agents:', e);
      }
    }

    function applySettings(data) {
      if (!data) return;
      config = { ...config, ...data };
      if (config.soundVolume !== undefined) config.soundVolume = Number(config.soundVolume);
    }

    window.addEventListener('onWidgetLoad', (e) => {
      const fieldData = e.detail?.fieldData || e.detail;
      applySettings(fieldData);
      loadAgents();
    });

    window.addEventListener('onFieldsUpdate', (e) => {
      const fieldData = e.detail?.fieldData || e.detail;
      applySettings(fieldData);
    });

    // Execute Random Roll Animation
    function displayRoll(eventData) {
      if (!allAgents || allAgents.length === 0) {
        loadAgents().then(() => runRollAnimation(eventData));
      } else {
        runRollAnimation(eventData);
      }
    }

    function runRollAnimation(eventData) {
      if (hideTimer) clearTimeout(hideTimer);

      const overlay = document.getElementById('val-overlay');
      const singleCard = document.getElementById('single-agent-card');
      const teamGrid = document.getElementById('team-grid-container');
      const rouletteScreen = document.getElementById('roulette-screen');
      const spinnerName = document.getElementById('spinner-name');
      const spinnerIcon = document.getElementById('spinner-icon');
      const flash = document.getElementById('card-flash');

      // Check Mode: Single vs Team
      const isTeamMode = eventData.mode === 'team' || (Array.isArray(eventData.agents) && eventData.agents.length > 1);

      overlay.classList.toggle('team-mode', isTeamMode);
      overlay.classList.add('active');

      // Requester info
      const requesterPill = document.getElementById('requester-pill');
      if (eventData.username && config.showRequester !== false) {
        document.getElementById('requester-name').textContent = eventData.username;
        const avatarImg = document.getElementById('requester-avatar');
        avatarImg.src = eventData.avatar || `/api/twitch/avatar/${encodeURIComponent(eventData.username)}`;
        requesterPill.style.display = 'flex';
      } else {
        requesterPill.style.display = 'none';
      }

      if (isTeamMode) {
        // Team Composition Mode
        renderTeamMode(eventData.agents || []);
      } else {
        // Single Agent Mode with Roulette
        rouletteScreen.classList.remove('hidden');

        // Pick target agent
        const targetAgent = eventData.agent || allAgents[Math.floor(Math.random() * allAgents.length)];

        // Run spinning roulette
        let spinCount = 0;
        const totalSpins = 18;
        let speed = 60;

        function stepSpin() {
          const randomA = allAgents[Math.floor(Math.random() * allAgents.length)];
          spinnerName.textContent = randomA.name;
          spinnerIcon.src = randomA.icon;
          playSound('tick');

          spinCount++;
          if (spinCount < totalSpins) {
            speed += 12; // decelerate
            setTimeout(stepSpin, speed);
          } else {
            // Lock in target agent!
            rouletteScreen.classList.add('hidden');
            revealSingleAgent(targetAgent);
          }
        }

        stepSpin();
      }

      // Auto Dismiss
      const duration = (Number(config.displayDuration) || 9) * 1000;
      hideTimer = setTimeout(() => {
        overlay.classList.remove('active');
      }, duration);
    }

    function revealSingleAgent(agent) {
      playSound('lockin');

      // Trigger Flash
      const flash = document.getElementById('card-flash');
      flash.classList.add('flash');
      setTimeout(() => flash.classList.remove('flash'), 120);

      document.getElementById('agent-name').textContent = agent.name;
      document.getElementById('watermark-role').textContent = agent.role.name;
      document.getElementById('role-name').textContent = agent.role.name;
      document.getElementById('role-icon').src = agent.role.icon;
      document.getElementById('protocol-id').textContent = `// VAL-ID: ${agent.name.toUpperCase()}`;

      // Set Role Color Styles
      const roleName = (agent.role.name || '').toLowerCase();
      let roleColor = 'var(--val-red)';
      if (roleName.includes('initiator')) roleColor = 'var(--role-initiator)';
      else if (roleName.includes('controller')) roleColor = 'var(--role-controller)';
      else if (roleName.includes('sentinel')) roleColor = 'var(--role-sentinel)';

      const rolePill = document.getElementById('role-pill');
      rolePill.style.borderColor = roleColor;
      rolePill.style.color = roleColor;

      // Aura & Background
      const aura = document.getElementById('agent-aura');
      aura.style.background = roleColor;

      const bgArt = document.getElementById('agent-bg');
      if (agent.background) {
        bgArt.style.backgroundImage = `url('${agent.background}')`;
        bgArt.style.opacity = '0.35';
      } else {
        bgArt.style.backgroundImage = 'none';
      }

      // Portrait Image
      const portrait = document.getElementById('agent-portrait');
      portrait.src = agent.fullPortrait || agent.bustPortrait || agent.icon;

      // Abilities
      const abilContainer = document.getElementById('abilities-container');
      abilContainer.innerHTML = '';
      if (config.showAbilities !== false && Array.isArray(agent.abilities)) {
        agent.abilities.slice(0, 4).forEach(ab => {
          if (!ab.icon) return;
          const slot = document.createElement('div');
          slot.className = 'ability-slot';
          slot.title = ab.name;
          slot.innerHTML = `
            <img src="${ab.icon}" alt="${ab.name}">
            <span class="ability-name">${ab.name}</span>
          `;
          abilContainer.appendChild(slot);
        });
      }
    }

    function renderTeamMode(agents) {
      playSound('lockin');
      const container = document.getElementById('team-grid-container');
      container.innerHTML = '';

      agents.forEach((agent, idx) => {
        const card = document.createElement('div');
        card.className = 'team-agent-card';
        card.innerHTML = `
          <div class="team-portrait">
            <img src="${agent.fullPortrait || agent.bustPortrait || agent.icon}" alt="${agent.name}">
          </div>
          <div class="team-agent-info">
            <div class="role-pill" style="margin-bottom: 6px; font-size: 10px; padding: 2px 8px;">
              <img src="${agent.role.icon}" style="width: 12px; height: 12px;">
              <span>${agent.role.name}</span>
            </div>
            <div class="team-agent-name">${agent.name}</div>
          </div>
        `;
        container.appendChild(card);

        // Staggered reveal
        setTimeout(() => {
          card.classList.add('revealed');
          playSound('tick');
        }, idx * 180 + 100);
      });
    }

    // Socket Event Listener for Valorant Rolls
    window.addEventListener('onEventReceived', (e) => {
      const obj = e.detail;
      if (!obj) return;

      // Check if it's a valorant roll event
      if (obj.type === 'valorant_agent_roll' || obj.event?.type === 'valorant_agent_roll') {
        const data = obj.data || obj.event || obj;
        displayRoll(data);
        return;
      }

      // Check Channel Points Redemption
      if (obj.listener === 'redemption-latest' || obj.event?.type === 'redemption' || obj.type === 'redemption') {
        const ev = obj.event || obj;
        const rewardTitle = (ev.data?.rewardTitle || ev.reward?.title || '').trim().toLowerCase();
        const configuredReward = (config.rewardName || '').trim().toLowerCase();

        if (configuredReward !== '' && rewardTitle === configuredReward) {
          // Trigger roll via API or local random
          const username = ev.data?.userName || ev.data?.name || 'Viewer';
          fetch('/api/widgets/valorant-agent/roll', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username,
              user: config.user || ''
            })
          }).catch(console.error);
        }
      }
    });
  </script>
</body>
