<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotify Song Request & Now Playing - FASTCHICK</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/adapter.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');

    :root {
      --accent-color: #1DB954;
      --accent-glow: rgba(29, 185, 84, 0.45);
      --bg-surface: rgba(18, 18, 22, 0.85);
      --border-color: rgba(255, 255, 255, 0.12);
      --text-primary: #FFFFFF;
      --text-secondary: rgba(255, 255, 255, 0.7);
      --radius-card: 16px;
      --radius-art: 12px;
      --font-main: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: var(--font-main);
      color: var(--text-primary);
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
    }

    /* Card Root Container */
    .spotify-card {
      position: relative;
      width: 520px;
      min-height: 120px;
      border-radius: var(--radius-card);
      padding: 16px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* Theme 1: Glassmorphism (Default) */
    .theme-glassmorphism {
      background: linear-gradient(135deg, rgba(26, 26, 36, 0.82), rgba(16, 16, 22, 0.94));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45), 0 0 24px var(--accent-glow);
    }

    /* Theme 2: Cyberpunk Neon */
    .theme-cyberpunk {
      background: rgba(10, 10, 15, 0.95);
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow), inset 0 0 15px rgba(0, 0, 0, 0.8);
      border-radius: 6px;
    }
    .theme-cyberpunk .album-art {
      border-radius: 4px;
    }
    .theme-cyberpunk .status-pill {
      border-radius: 4px;
    }

    /* Theme 3: Clean Minimalist */
    .theme-minimal {
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border-radius: 12px;
    }

    /* Theme 4: Retro Vinyl */
    .theme-vinyl .album-art {
      border-radius: 50%;
      animation: spinVinyl 12s linear infinite;
      box-shadow: 0 0 0 4px #1a1a1a, 0 0 0 8px #2a2a2a, 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Toast Notification for New Requests */
    .request-toast {
      position: absolute;
      top: 10px;
      left: 16px;
      right: 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.95), rgba(20, 140, 60, 0.95));
      color: #FFFFFF;
      padding: 8px 14px;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4);
      animation: slideToast 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 0.85rem;
      font-weight: 600;
    }
    .toast-badge {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      font-family: var(--font-mono);
    }
    .toast-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes slideToast {
      from { transform: translateY(-120%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Idle State View */
    .idle-view {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 6px 4px;
    }
    .idle-icon-wrapper {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: rgba(29, 185, 84, 0.12);
      color: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(29, 185, 84, 0.25);
      flex-shrink: 0;
      animation: pulseGlow 3s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(29, 185, 84, 0.2); }
      50% { box-shadow: 0 0 22px rgba(29, 185, 84, 0.5); }
    }
    .idle-text-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .idle-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .idle-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .highlight-pill {
      background: rgba(255, 255, 255, 0.1);
      color: var(--accent-color);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 600;
    }

    /* Active Playing View */
    .playing-view {
      display: flex;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Album Art */
    .art-container {
      position: relative;
      width: 84px;
      height: 84px;
      flex-shrink: 0;
    }
    .album-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-art);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Sound Visualizer Bars */
    .sound-visualizer {
      position: absolute;
      bottom: 6px;
      right: 6px;
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 18px;
      background: rgba(0, 0, 0, 0.7);
      padding: 3px 5px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .sound-visualizer .bar {
      width: 3px;
      background: var(--accent-color);
      border-radius: 2px;
      animation: barBounce 0.8s ease-in-out infinite alternate;
    }
    .sound-visualizer .bar-1 { height: 6px; animation-delay: 0.1s; }
    .sound-visualizer .bar-2 { height: 14px; animation-delay: 0.3s; }
    .sound-visualizer .bar-3 { height: 9px; animation-delay: 0.15s; }
    .sound-visualizer .bar-4 { height: 16px; animation-delay: 0.45s; }
    .sound-visualizer .bar-5 { height: 7px; animation-delay: 0.25s; }

    @keyframes barBounce {
      0% { height: 3px; opacity: 0.5; }
      100% { height: 16px; opacity: 1; }
    }

    /* Track Details Group */
    .track-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Meta Header Row (Status & Requester) */
    .meta-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--accent-color);
      background: rgba(29, 185, 84, 0.12);
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid rgba(29, 185, 84, 0.25);
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-color);
      animation: pulseDot 1.4s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    .requester-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      color: #BF94FF;
      background: rgba(145, 70, 255, 0.14);
      border: 1px solid rgba(145, 70, 255, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .twitch-icon {
      flex-shrink: 0;
    }

    /* Track Title & Artist */
    .track-title-wrapper {
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }
    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      display: inline-block;
    }
    .track-artist {
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Real-time Progress Bar */
    .progress-container {
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent-color);
      border-radius: 6px;
      transition: width 0.3s linear;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--text-secondary);
    }

    .hidden {
      display: none !important;
    }

    /* ============================================================
       Theme 5: Waveform Compact
       Layout: [AlbumArt] [Title / Artist / Time ▌Waveform▌ Time]
       Bottom edge: thin progress bar
       ============================================================ */
    .theme-waveform {
      background: rgba(10, 12, 18, 0.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: none;
      border-radius: 10px;
      box-shadow: none;
      padding: 10px 14px 18px 10px;
      width: auto;
      min-height: unset;
      overflow: visible;
    }
    .theme-waveform .meta-header-row {
      display: none !important;
    }
    .theme-waveform .art-container {
      width: 70px;
      height: 70px;
      flex-shrink: 0;
    }
    .theme-waveform .album-art {
      width: 70px;
      height: 70px;
      border-radius: 6px;
      border: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      filter: brightness(0.85);
    }
    .theme-waveform .sound-visualizer {
      display: none !important;
    }
    .theme-waveform .track-details {
      gap: 2px;
    }
    .theme-waveform .track-title {
      font-size: 1.05rem;
      font-weight: 700;
    }
    .theme-waveform .track-artist {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 4px;
    }
    .theme-waveform #progress-container {
      display: none !important;
    }

    /* Waveform Row */
    .waveform-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    .wf-time {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .waveform-bars {
      display: flex;
      align-items: center;
      gap: 1px;
      height: 22px;
      flex: 1;
      overflow: hidden;
    }
    .waveform-bars .wb {
      flex: 1;
      min-width: 1.5px;
      max-width: 4px;
      border-radius: 1px;
      background: var(--accent-color);
      animation: wbPulse var(--wdur, 0.9s) ease-in-out infinite alternate;
      opacity: 0.88;
      height: var(--wh, 10px);
    }
    .waveform-bars .wb:nth-child(1)  { --wh: 6px;  --wdur: 0.82s; animation-delay: 0.00s; }
    .waveform-bars .wb:nth-child(2)  { --wh: 13px; --wdur: 0.75s; animation-delay: 0.05s; }
    .waveform-bars .wb:nth-child(3)  { --wh: 9px;  --wdur: 0.91s; animation-delay: 0.11s; }
    .waveform-bars .wb:nth-child(4)  { --wh: 18px; --wdur: 0.68s; animation-delay: 0.03s; }
    .waveform-bars .wb:nth-child(5)  { --wh: 7px;  --wdur: 0.85s; animation-delay: 0.17s; }
    .waveform-bars .wb:nth-child(6)  { --wh: 20px; --wdur: 0.72s; animation-delay: 0.08s; }
    .waveform-bars .wb:nth-child(7)  { --wh: 11px; --wdur: 0.95s; animation-delay: 0.22s; }
    .waveform-bars .wb:nth-child(8)  { --wh: 16px; --wdur: 0.79s; animation-delay: 0.14s; }
    .waveform-bars .wb:nth-child(9)  { --wh: 8px;  --wdur: 0.88s; animation-delay: 0.06s; }
    .waveform-bars .wb:nth-child(10) { --wh: 19px; --wdur: 0.70s; animation-delay: 0.19s; }
    .waveform-bars .wb:nth-child(11) { --wh: 5px;  --wdur: 0.93s; animation-delay: 0.27s; }
    .waveform-bars .wb:nth-child(12) { --wh: 17px; --wdur: 0.76s; animation-delay: 0.10s; }
    .waveform-bars .wb:nth-child(13) { --wh: 12px; --wdur: 0.84s; animation-delay: 0.32s; }
    .waveform-bars .wb:nth-child(14) { --wh: 20px; --wdur: 0.67s; animation-delay: 0.04s; }
    .waveform-bars .wb:nth-child(15) { --wh: 9px;  --wdur: 0.89s; animation-delay: 0.23s; }
    .waveform-bars .wb:nth-child(16) { --wh: 15px; --wdur: 0.73s; animation-delay: 0.15s; }
    .waveform-bars .wb:nth-child(17) { --wh: 6px;  --wdur: 0.97s; animation-delay: 0.37s; }
    .waveform-bars .wb:nth-child(18) { --wh: 18px; --wdur: 0.78s; animation-delay: 0.09s; }
    .waveform-bars .wb:nth-child(19) { --wh: 10px; --wdur: 0.86s; animation-delay: 0.28s; }
    .waveform-bars .wb:nth-child(20) { --wh: 21px; --wdur: 0.65s; animation-delay: 0.01s; }
    .waveform-bars .wb:nth-child(21) { --wh: 7px;  --wdur: 0.92s; animation-delay: 0.34s; }
    .waveform-bars .wb:nth-child(22) { --wh: 16px; --wdur: 0.74s; animation-delay: 0.18s; }
    .waveform-bars .wb:nth-child(23) { --wh: 13px; --wdur: 0.87s; animation-delay: 0.42s; }
    .waveform-bars .wb:nth-child(24) { --wh: 19px; --wdur: 0.71s; animation-delay: 0.12s; }
    .waveform-bars .wb:nth-child(25) { --wh: 8px;  --wdur: 0.94s; animation-delay: 0.25s; }
    .waveform-bars .wb:nth-child(26) { --wh: 20px; --wdur: 0.69s; animation-delay: 0.07s; }
    .waveform-bars .wb:nth-child(27) { --wh: 11px; --wdur: 0.83s; animation-delay: 0.38s; }
    .waveform-bars .wb:nth-child(28) { --wh: 17px; --wdur: 0.77s; animation-delay: 0.20s; }
    .waveform-bars .wb:nth-child(29) { --wh: 6px;  --wdur: 0.96s; animation-delay: 0.44s; }
    .waveform-bars .wb:nth-child(30) { --wh: 14px; --wdur: 0.81s; animation-delay: 0.13s; }
    .waveform-bars .wb:nth-child(31) { --wh: 9px;  --wdur: 0.90s; animation-delay: 0.30s; }
    .waveform-bars .wb:nth-child(32) { --wh: 22px; --wdur: 0.66s; animation-delay: 0.02s; }
    .waveform-bars .wb:nth-child(33) { --wh: 7px;  --wdur: 0.98s; animation-delay: 0.47s; }
    .waveform-bars .wb:nth-child(34) { --wh: 15px; --wdur: 0.80s; animation-delay: 0.16s; }
    .waveform-bars .wb:nth-child(35) { --wh: 12px; --wdur: 0.88s; animation-delay: 0.35s; }
    .waveform-bars .wb:nth-child(36) { --wh: 18px; --wdur: 0.73s; animation-delay: 0.21s; }
    .waveform-bars .wb:nth-child(37) { --wh: 5px;  --wdur: 1.00s; animation-delay: 0.49s; }
    .waveform-bars .wb:nth-child(38) { --wh: 16px; --wdur: 0.76s; animation-delay: 0.26s; }
    .waveform-bars .wb:nth-child(39) { --wh: 10px; --wdur: 0.85s; animation-delay: 0.40s; }
    .waveform-bars .wb:nth-child(40) { --wh: 19px; --wdur: 0.70s; animation-delay: 0.08s; }
    .waveform-bars .wb:nth-child(41) { --wh: 8px;  --wdur: 0.93s; animation-delay: 0.46s; }
    .waveform-bars .wb:nth-child(42) { --wh: 14px; --wdur: 0.78s; animation-delay: 0.31s; }
    .waveform-bars .wb:nth-child(43) { --wh: 11px; --wdur: 0.87s; animation-delay: 0.43s; }
    .waveform-bars .wb:nth-child(44) { --wh: 17px; --wdur: 0.72s; animation-delay: 0.24s; }
    @keyframes wbPulse {
      0%   { height: 3px; opacity: 0.35; }
      100% { height: var(--wh, 12px); opacity: 1; }
    }

    /* Bottom edge progress bar — waveform theme only */
    .bottom-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.10);
      border-radius: 0 0 10px 10px;
      overflow: hidden;
    }
    .bottom-progress-fill {
      height: 100%;
      background: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: width 0.3s linear;
      border-radius: 0 0 10px 10px;
    }
  </style>
</head>
<body>
  <div id="spotify-widget-root" class="spotify-card theme-glassmorphism">
    <!-- Toast Notification when a new song is requested -->
    <div id="request-toast" class="request-toast hidden">
      <span class="toast-badge">🎵 REQUEST</span>
      <span id="toast-text" class="toast-text">เพิ่มเพลงลงคิวแล้ว!</span>
    </div>

    <!-- Idle State View -->
    <div id="idle-view" class="idle-view">
      <div class="idle-icon-wrapper">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.502 17.308c-.218.358-.684.474-1.042.256-2.857-1.745-6.455-2.14-10.69-1.172-.409.094-.816-.16-.91-.569-.093-.41.16-.817.57-.91 4.636-1.06 8.604-.61 11.815 1.353.359.218.475.684.257 1.042zm1.468-3.26c-.274.446-.86.588-1.306.314-3.27-2.01-8.254-2.593-12.12-1.42-.497.15-1.026-.135-1.176-.632-.15-.497.135-1.026.632-1.176 4.417-1.34 9.911-.69 13.656 1.608.446.274.588.86.314 1.306zm.126-3.398C15.18 8.32 8.71 8.1 4.978 9.233c-.604.183-1.246-.164-1.429-.768-.182-.604.165-1.246.769-1.429 4.29-1.302 11.438-1.047 16.002 1.662.544.323.725 1.033.402 1.577-.323.543-1.033.724-1.576.401z"/>
        </svg>
      </div>
      <div class="idle-text-group">
        <div class="idle-title">พร้อมรับเพลงจากผู้ชม</div>
        <div class="idle-desc">พิมพ์ <span id="idle-cmd-label" class="highlight-pill">!sr ชื่อเพลง</span> ในแชทเพื่อขอเพลง</div>
      </div>
    </div>

    <!-- Active Playing View -->
    <div id="playing-view" class="playing-view hidden">
      <!-- Album Art & Vinyl -->
      <div class="art-container">
        <img id="album-art" class="album-art" src="" alt="Album Artwork" />
        <div id="vinyl-disc" class="vinyl-disc hidden"></div>
        <div id="visualizer" class="sound-visualizer">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
          <span class="bar bar-4"></span>
          <span class="bar bar-5"></span>
        </div>
      </div>

      <!-- Track Details -->
      <div class="track-details">
        <!-- Status Pill & Requester Row -->
        <div class="meta-header-row">
          <span id="status-pill" class="status-pill">
            <span class="pulse-dot"></span>
            <span id="status-text">NOW PLAYING</span>
          </span>
          <span id="requester-badge" class="requester-badge hidden">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" class="twitch-icon">
              <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/>
            </svg>
            <span id="requester-name">@Streamer</span>
          </span>
        </div>

        <!-- Title & Artist -->
        <div class="track-title-wrapper">
          <div id="track-title" class="track-title">กำลังโหลดชื่อเพลง...</div>
        </div>
        <div id="track-artist" class="track-artist">ศิลปิน</div>

        <!-- Waveform Row — visible only on waveform theme -->
        <div id="waveform-row" class="waveform-row hidden">
          <span id="wf-time-current" class="wf-time">00:00</span>
          <div class="waveform-bars" id="waveform-bars">
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
            <span class="wb"></span><span class="wb"></span><span class="wb"></span><span class="wb"></span>
          </div>
          <span id="wf-time-total" class="wf-time">00:00</span>
        </div>

        <!-- Real-time Progress Bar -->
        <div id="progress-container" class="progress-container">
          <div class="progress-bar-bg">
            <div id="progress-bar-fill" class="progress-bar-fill" style="width: 0%;"></div>
          </div>
          <div class="time-labels">
            <span id="time-current">00:00</span>
            <span id="time-total">00:00</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom edge progress bar — waveform theme only -->
    <div id="bottom-progress-bar" class="bottom-progress-bar hidden">
      <div id="bottom-progress-fill" class="bottom-progress-fill" style="width: 0%;"></div>
    </div>
  </div>

  <script>
    let currentTrack = null;
    let isPlaying = false;
    let currentProgressMs = 0;
    let totalDurationMs = 0;
    let progressInterval = null;
    let toastTimeout = null;

    let settings = {
      theme: 'glassmorphism',
      accentColor: '#1DB954',
      showVisualizer: true,
      showProgressBar: true,
      showRequester: true,
      commandPrefix: '!sr',
      channelPointsReward: 'ขอเพลง',
      idleBehavior: 'idle_card'
    };

    function formatTime(ms) {
      if (!ms || isNaN(ms)) return '00:00';
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    function applySettings(newSettings) {
      if (!newSettings) return;
      settings = { ...settings, ...newSettings };

      const root = document.getElementById('spotify-widget-root');
      if (root) {
        root.className = 'spotify-card';
        root.classList.add(`theme-${settings.theme || 'glassmorphism'}`);

        let accent = settings.accentColor || '#1DB954';
        root.style.setProperty('--accent-color', accent);
        root.style.setProperty('--accent-glow', `${accent}40`);

        const isWaveform = settings.theme === 'waveform';

        const vinylDisc = document.getElementById('vinyl-disc');
        if (vinylDisc) {
          if (settings.theme === 'vinyl') vinylDisc.classList.remove('hidden');
          else vinylDisc.classList.add('hidden');
        }

        const visualizer = document.getElementById('visualizer');
        if (visualizer) {
          if (settings.showVisualizer !== false && !isWaveform) visualizer.classList.remove('hidden');
          else visualizer.classList.add('hidden');
        }

        const progContainer = document.getElementById('progress-container');
        if (progContainer) {
          if (settings.showProgressBar !== false && !isWaveform) progContainer.classList.remove('hidden');
          else progContainer.classList.add('hidden');
        }

        const waveformRow = document.getElementById('waveform-row');
        const bottomBar = document.getElementById('bottom-progress-bar');
        if (waveformRow) {
          if (isWaveform) waveformRow.classList.remove('hidden');
          else waveformRow.classList.add('hidden');
        }
        if (bottomBar) {
          if (isWaveform) bottomBar.classList.remove('hidden');
          else bottomBar.classList.add('hidden');
        }

        const reqBadge = document.getElementById('requester-badge');
        if (reqBadge && (!settings.showRequester || !reqBadge.dataset.hasUser)) {
          reqBadge.classList.add('hidden');
        }

        const cmdLabel = document.getElementById('idle-cmd-label');
        if (cmdLabel) {
          cmdLabel.innerText = `${settings.commandPrefix || '!sr'} ชื่อเพลง`;
        }

        // Status text update
        const statusText = document.getElementById('status-text');
        if (statusText) {
          statusText.innerText = isPlaying ? 'NOW PLAYING' : 'PAUSED';
        }
      }
    }

    function startProgressTimer() {
      if (progressInterval) clearInterval(progressInterval);
      progressInterval = setInterval(() => {
        if (!isPlaying || !totalDurationMs) return;
        currentProgressMs += 1000;
        if (currentProgressMs > totalDurationMs) currentProgressMs = totalDurationMs;

        const pct = Math.min(100, Math.max(0, (currentProgressMs / totalDurationMs) * 100));
        const timeStr = formatTime(currentProgressMs);

        const fill = document.getElementById('progress-bar-fill');
        const timeCurrent = document.getElementById('time-current');
        if (fill && totalDurationMs > 0) fill.style.width = `${pct}%`;
        if (timeCurrent) timeCurrent.innerText = timeStr;

        const wfCurrent = document.getElementById('wf-time-current');
        if (wfCurrent) wfCurrent.innerText = timeStr;
        const bottomFill = document.getElementById('bottom-progress-fill');
        if (bottomFill && totalDurationMs > 0) bottomFill.style.width = `${pct}%`;
      }, 1000);
    }



    function updatePlayingState(data) {
      const root = document.getElementById('spotify-widget-root');
      const idleView = document.getElementById('idle-view');
      const playingView = document.getElementById('playing-view');
      const albumArt = document.getElementById('album-art');
      const trackTitle = document.getElementById('track-title');
      const trackArtist = document.getElementById('track-artist');
      const timeCurrent = document.getElementById('time-current');
      const timeTotal = document.getElementById('time-total');
      const progressBarFill = document.getElementById('progress-bar-fill');
      const reqBadge = document.getElementById('requester-badge');
      const reqName = document.getElementById('requester-name');
      const statusText = document.getElementById('status-text');

      if (!data || !data.track || !data.isPlaying) {
        isPlaying = false;
        if (settings.idleBehavior === 'hide') {
          root.classList.add('hidden');
        } else {
          root.classList.remove('hidden');
          idleView.classList.remove('hidden');
          playingView.classList.add('hidden');
        }
        return;
      }

      root.classList.remove('hidden');
      idleView.classList.add('hidden');
      playingView.classList.remove('hidden');

      isPlaying = Boolean(data.isPlaying);
      currentProgressMs = data.progressMs || 0;
      totalDurationMs = data.durationMs || data.track?.durationMs || 0;

      if (albumArt) albumArt.src = data.track.albumArt || 'https://via.placeholder.com/120x120?text=Spotify';
      if (trackTitle) trackTitle.innerText = data.track.name || 'Unknown Track';
      if (trackArtist) trackArtist.innerText = data.track.artists || 'Unknown Artist';

      if (timeCurrent) timeCurrent.innerText = formatTime(currentProgressMs);
      if (timeTotal) timeTotal.innerText = formatTime(totalDurationMs);

      if (progressBarFill && totalDurationMs > 0) {
        const pct = Math.min(100, Math.max(0, (currentProgressMs / totalDurationMs) * 100));
        progressBarFill.style.width = `${pct}%`;
      }

      // Init waveform theme times + bottom bar
      const wfCurrent = document.getElementById('wf-time-current');
      const wfTotal = document.getElementById('wf-time-total');
      const bottomFill = document.getElementById('bottom-progress-fill');
      if (wfCurrent) wfCurrent.innerText = formatTime(currentProgressMs);
      if (wfTotal) wfTotal.innerText = formatTime(totalDurationMs);
      if (bottomFill && totalDurationMs > 0) {
        const pct = Math.min(100, Math.max(0, (currentProgressMs / totalDurationMs) * 100));
        bottomFill.style.width = `${pct}%`;
      }

      if (statusText) {
        statusText.innerText = isPlaying ? 'NOW PLAYING' : 'PAUSED';
      }

      if (reqBadge && reqName) {
        if (data.requester && settings.showRequester !== false) {
          reqName.innerText = `@${data.requester}`;
          reqBadge.dataset.hasUser = 'true';
          reqBadge.classList.remove('hidden');
        } else {
          reqBadge.dataset.hasUser = '';
          reqBadge.classList.add('hidden');
        }
      }

      startProgressTimer();
    }

    function showRequestToast(trackName, requester) {
      const toast = document.getElementById('request-toast');
      const text = document.getElementById('toast-text');
      if (!toast || !text) return;

      text.innerText = `คิวใหม่: "${trackName}" โดย @${requester || 'แชท'}`;
      toast.classList.remove('hidden');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('hidden');
      }, 6000);
    }

    window.addEventListener('onWidgetLoad', function(obj) {
      const fieldData = obj.detail?.fieldData || {};
      const params = new URLSearchParams(window.location.search);
      const user = params.get('user') || '';
      const isPreview = params.get('preview') === '1';

      function showPreviewTrackFallback() {
        if (isPreview && !currentTrack) {
          updatePlayingState({
            isPlaying: true,
            progressMs: 65000,
            durationMs: 215000,
            track: {
              name: 'YUNG TONY STARK',
              artists: 'SURIYA MQT, YUNGTARR',
              albumArt: 'https://i.scdn.co/image/ab67616d0000b2733a7f390ec27fb09dccdeb23c'
            },
            requester: 'ChatViewer'
          });
        }
      }

      fetch(`/api/spotify/currently-playing?user=${encodeURIComponent(user)}`)
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data && data.track && data.isPlaying) {
            updatePlayingState(data);
          } else {
            showPreviewTrackFallback();
            if (data && !isPreview) updatePlayingState(data);
          }
        })
        .catch(() => {
          showPreviewTrackFallback();
        });
    });

    window.addEventListener('onFieldsUpdate', function(obj) {
      const fieldData = obj.detail?.fieldData || obj.detail || {};
      applySettings(fieldData);
    });

    window.addEventListener('message', function(e) {
      if (e.data && (e.data.type === 'onWidgetLoad' || e.data.type === 'onFieldsUpdate')) {
        applySettings(e.data.fieldData || {});
      } else if (e.data && e.data.type === 'spotify_now_playing') {
        updatePlayingState(e.data.data);
      }
    });

    window.addEventListener('onEventReceived', function(obj) {
      const event = obj.detail;
      if (!event) return;

      if (event.type === 'spotify_now_playing') {
        updatePlayingState(event.data);
      } else if (event.type === 'spotify_new_request') {
        showRequestToast(event.data?.track?.name, event.data?.requester);
      }
    });
  </script>
</body>
</html>
